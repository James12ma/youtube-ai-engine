name: Deployed premium owner entrypoint acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [start, status]
        default: start
      message_id:
        default: '2026102001'
permissions:
  contents: read
jobs:
  acceptance:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticated owner webhook, deduplication, queue
        env:
          TG: ${{ secrets.ALAN7_TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.ALAN7_OWNER_ID }}
          PHASE: ${{ inputs.phase }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {webhookSecret} from './alan7_bot/src/index.js';
          const origin='https://alan7-bot.goatgold393.workers.dev';
          assert.equal((await fetch(origin+'/health')).status,200);
          assert.equal((await fetch(origin+'/telegram',{method:'POST',body:'{}'})).status,403);
          const owner=Number(process.env.OWNER),message_id=Number(process.env.MESSAGE_ID);
          const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('premium:'+owner+':'+message_id));
          const id=[...new Uint8Array(bytes)].slice(0,4).map(x=>x.toString(16).padStart(2,'0')).join('');
          const headers={'content-type':'application/json','x-telegram-bot-api-secret-token':await webhookSecret(process.env.TG)};
          async function command(text,mid=message_id,who=owner){
            const body={update_id:mid,message:{message_id:mid,from:{id:who},chat:{id:owner,type:'private'},text}};
            const r=await fetch(origin+'/telegram',{method:'POST',headers,body:JSON.stringify(body)});
            assert.equal(r.status,200);return r;
          }
          if(process.env.PHASE==='start'){
            const ignored=await command('/motiontest',message_id,owner+1);
            assert.equal(await ignored.text(),'ok');
            const r=await command('/script en Before your next interview, choose one clear example. Explain the situation, the action you took, and the result. Practice once, listen carefully, and make your answer your own.');
            const b=await r.json();
            assert.ok(b.text.includes(id)&&b.text.includes('lanse'),'Owner command did not dispatch');
            const duplicate=await (await command('/script en Before your next interview, choose one clear example. Explain the situation, the action you took, and the result. Practice once, listen carefully, and make your answer your own.')).json();
            assert.ok(duplicate.text.includes('deja')&&duplicate.text.includes(id),'Duplicate was not suppressed');
            console.log(JSON.stringify({job_id:id,health:200,unauthenticated:403,non_owner_ignored:true,dispatched:true,duplicate_suppressed:true}));
          }else{
            const b=await (await command('/queue',message_id+1)).json();
            const row=b.text.split('\n').find(x=>x.includes(id));
            assert.ok(row,'Job missing from D1 queue');
            console.log(JSON.stringify({job_id:id,queue_row:row}));
            assert.ok(row.includes('done'),'Production job has not completed successfully');
          }
          JS
