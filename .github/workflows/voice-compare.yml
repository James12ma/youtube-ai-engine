name: Semantic film private Telegram acceptance (free, isolated)
on:
  workflow_dispatch:
    inputs:
      delivery_pubkey:
        description: Owner-session public review key
        required: true
permissions:
  contents: read
jobs:
  acceptance:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix alan7_bot --no-audit --no-fund
      - name: Actual branch Worker, local D1, private Telegram and real isolated dispatch
        env:
          TG: ${{ secrets.ALAN7_TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.ALAN7_OWNER_ID }}
          GH: ${{ secrets.ALAN7_GITHUB_TOKEN }}
          CINEMA_REVIEW_REF: feat/semantic-film-director-20261020
          MESSAGE_ID: '2026102022'
          DELIVERY_PUBKEY: ${{ inputs.delivery_pubkey }}
        run: node scripts/cinema_telegram_acceptance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-private-telegram-evidence
          path: cinema-telegram-evidence.json
          if-no-files-found: error
