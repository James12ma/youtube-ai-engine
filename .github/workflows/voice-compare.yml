name: Focus Blender preview acceptance (free CPU, private owner delivery)
run-name: alan7 ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        default: a20c1002
      delivery_pubkey:
        description: Optional owner-session public key for encrypted review copy
        default: ''
permissions:
  contents: write
concurrency:
  group: alan7-premium-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  premium:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      YOUTUBE_UPLOAD_ALLOWED: '0'
      YOUTUBE_PUBLIC_ALLOWED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python required by Blender wheel
        uses: actions/setup-python@v5
        id: bpy-runtime
        with:
          python-version: '3.13'
          update-environment: false
      - name: Isolated Blender runtime
        env:
          BPY_RUNTIME: ${{ steps.bpy-runtime.outputs.python-path }}
        run: |
          "$BPY_RUNTIME" -m venv "$RUNNER_TEMP/bpy-env"
          "$RUNNER_TEMP/bpy-env/bin/python" -m pip install bpy==5.2.2
          echo "BPY_PYTHON=$RUNNER_TEMP/bpy-env/bin/python" >> "$GITHUB_ENV"
      - name: Free rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install numpy httpx Pillow
          cd tiktok_motion/premium/remotion && npm ci --no-audit --no-fund
          npx --no-install remotion browser ensure
      - name: Actual Blender Cycles and Remotion preview
        env:
          PREVIEW: '1'
          JOBS: '2'
        run: |
          bash tiktok_motion/premium/render.sh
          mkdir -p outputs/premium
          cp tiktok_motion/premium/out/focus_prototype_preview.mp4 outputs/premium/focus-3d-preview.mp4
          cp tiktok_motion/premium/out/qa_report.json outputs/premium/report.json
          cp -r tiktok_motion/premium/out/frames outputs/premium/frames
      - name: Private owner delivery
        env:
          TG: ${{ secrets.ALAN7_TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.ALAN7_OWNER_ID }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from scripts.premium_private_job import deliver
          deliver(Path('outputs/premium/focus-3d-preview.mp4'),'sendVideo','video',os.environ['TG'],os.environ['OWNER'],'Focus · Blender 3D + Remotion · preview 13 s · pa pibliye')
          PYCODE
      - name: Encrypted owner-session video copy
        if: success() && inputs.delivery_pubkey != ''
        uses: ./.github/actions/encrypted-pack
        with:
          dir: outputs/premium
          pubkey_b64: ${{ inputs.delivery_pubkey }}
          token: ${{ github.token }}
          label: premium-motion
      - name: Save metadata evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-report-${{ inputs.job_id }}
          path: outputs/premium/report.json
          if-no-files-found: error
