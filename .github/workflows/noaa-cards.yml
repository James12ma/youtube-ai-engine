name: NOAA B-roll slates and sheets (encrypted review pack)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '";"-separated NOAA B-roll ids (must be in channel/noaa.py KNOWN)'
        required: true
      delivery_pubkey:
        required: true
permissions:
  contents: write  # only for the encrypted pack
jobs:
  cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -q httpx Pillow
      - env:
          IDS: ${{ inputs.ids }}
        run: python -m scripts.noaa_cards --ids "$IDS" --out outputs/cards && ls outputs/cards
      - uses: ./.github/actions/encrypted-pack
        with:
          dir: outputs/cards
          pubkey_b64: ${{ inputs.delivery_pubkey }}
          token: ${{ github.token }}
          label: NOAA slates
