name: Preview render of an automated draft (unreviewed, no upload)

# Renders the script/storyboard produced by a successful "Source-backed
# research and script dry run" so the owner can WATCH it before deciding on
# editorial approval. Output is labelled unreviewed; scenes that need real
# footage are visible placeholder cards. Nothing is uploaded or published.

on:
  workflow_dispatch:
    inputs:
      research_run_id:
        description: Run ID of a passed research dry run (its artifact must still exist)
        required: true
      voice:
        description: Piper voice (auto picks by script language)
        required: false
        default: auto
      format:
        description: Output format
        type: choice
        options: [landscape, portrait]
        default: landscape
      narrator:
        description: 'chatterbox = owner-approved shared voice (same as Alan7), piper = old voice'
        type: choice
        options: [chatterbox, piper]
        default: chatterbox
      delivery_pubkey:
        description: Base64 RSA public key (PEM). Videos leave the runner ONLY encrypted to this key; empty = no video leaves the runner.
        required: false
        default: ''

permissions:
  contents: write  # only to push an ENCRYPTED review pack to a qa/<run id> branch (no readable video ever)
  actions: read

concurrency:
  group: draft-preview-render
  cancel-in-progress: false

jobs:
  render:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
      YOUTUBE_UPLOAD_ALLOWED: '0'
      YOUTUBE_PUBLIC_ALLOWED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch draft from the research run
        uses: actions/download-artifact@v4
        with:
          name: source-script-dry-run-${{ inputs.research_run_id }}
          path: outputs/draft
          run-id: ${{ inputs.research_run_id }}
          github-token: ${{ github.token }}
      - name: Confirm the draft passed every automated gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          d = pathlib.Path('outputs/draft')
          r = json.loads((d / 'report.json').read_text())
          assert r.get('pipeline_passed') is True, 'research run did not pass'
          for name in ('script.json', 'storyboard.json', 'verification_gate.json'):
              assert (d / name).is_file(), name + ' missing'
          s = json.loads((d / 'script.json').read_text())
          print(f"::notice title=draft::{s['title']} | {s['word_count']} words | {len(s['sections'])} sections")
          PY
      - name: Choose voice
        shell: bash
        env:
          VOICE_INPUT: ${{ inputs.voice }}
        run: |
          set -euo pipefail
          lang=$(python -c "import json;print(json.load(open('outputs/draft/script.json')).get('language','en'))")
          if [ "$VOICE_INPUT" = "auto" ] || [ -z "$VOICE_INPUT" ]; then
            case "$lang" in
              es) voice=es_MX-claude-high ;;
              *)  voice=en_US-libritts-high ;;
            esac
          else
            [[ "$VOICE_INPUT" =~ ^[a-zA-Z_]+-[a-zA-Z0-9_]+-(x_low|low|medium|high)$ ]] || { echo "invalid voice name"; exit 1; }
            voice="$VOICE_INPUT"
          fi
          echo "VOICE_NAME=$voice" >> "$GITHUB_ENV"
          echo "::notice title=voice::$voice ($lang)"
      - name: Configure runner-local model directories
        shell: bash
        run: |
          printf '%s\n' \
            "VOICE_DIR=$RUNNER_TEMP/piper-voices" \
            "HF_HOME=$RUNNER_TEMP/hf-cache" \
            "TORCH_HOME=$RUNNER_TEMP/torch-cache" \
            "NLTK_DATA=$RUNNER_TEMP/nltk-data" >> "$GITHUB_ENV"
      - name: Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libgomp1 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.8.0' 'torchaudio==2.8.0' 'torchvision==0.23.0'
          python -m pip install -r requirements-narration.txt -r requirements.txt -r requirements-production.txt -r requirements-production-pro.txt
          python -m pip check
          python - <<'PY'
          import nltk, os
          nltk.download('punkt_tab', download_dir=os.environ['NLTK_DATA'], raise_on_error=True)
          PY
          ffmpeg -hide_banner -filters | grep -Eq ' subtitles '
      - name: Download Piper voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VOICE_DIR"
          python -m piper.download_voices --data-dir "$VOICE_DIR" "$VOICE_NAME"
          test -s "$VOICE_DIR/${VOICE_NAME}.onnx"
      - name: Texts to narrate (shared voice)
        if: inputs.narrator == 'chatterbox'
        shell: bash
        run: |
          set -euo pipefail
          out=$(python -m channel.cli render --draft outputs/draft --voice-model "$VOICE_DIR/${VOICE_NAME}.onnx" \
            --out outputs/preview/preview.mp4 --dump-texts narration_texts.json)
          echo "NARR_LANG=$(echo "$out" | python -c 'import json,sys;print(json.load(sys.stdin)["language"])')" >> "$GITHUB_ENV"
      - name: Narrate (owner-approved shared voice)
        if: inputs.narrator == 'chatterbox'
        uses: ./.github/actions/alan7-voice
        with:
          texts: narration_texts.json
          language: ${{ env.NARR_LANG }}
          out: outputs/narration
      - name: Free-licensed photos for photo scenes (Wikimedia Commons)
        shell: bash
        run: |
          set -euo pipefail
          if python -c "import json,sys;sys.exit(0 if any(s.get('visual_type')=='broll' for s in json.load(open('outputs/draft/storyboard.json'))['scenes']) else 1)"; then
            summary=$(python -m channel.commons --storyboard outputs/draft/storyboard.json --out outputs/preview/photos)
            echo "::notice title=photos::$summary"
          else
            mkdir -p outputs/preview/photos && echo '{}' > outputs/preview/photos/asset_map.json
          fi
      - name: Render unreviewed preview
        shell: bash
        run: |
          set -euo pipefail
          python -m channel.cli render --draft outputs/draft \
            --voice-model "$VOICE_DIR/${VOICE_NAME}.onnx" \
            --out outputs/preview/preview.mp4 --format "${{ inputs.format }}" \
            --asset-map outputs/preview/photos/asset_map.json \
            --unreviewed-preview ${{ inputs.narrator == 'chatterbox' && '--narration-dir outputs/narration' || '' }}
      - name: Render native vertical version for Shorts
        if: success() && inputs.format == 'landscape'
        shell: bash
        run: |
          set -euo pipefail
          python -m channel.cli render --draft outputs/draft \
            --voice-model "$VOICE_DIR/${VOICE_NAME}.onnx" \
            --out outputs/preview_vertical/vertical.mp4 --format portrait \
            --asset-map outputs/preview/photos/asset_map.json \
            --unreviewed-preview ${{ inputs.narrator == 'chatterbox' && '--narration-dir outputs/narration' || '' }}
      - name: Cut vertical Shorts from the vertical render
        if: success() && inputs.format == 'landscape'
        shell: bash
        run: |
          set -euo pipefail
          python -m channel.shorts --work outputs/preview_vertical/vertical_work --out outputs/preview/shorts --count 3
          for f in outputs/preview/shorts/short_*.mp4; do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            echo "::notice title=short::$(basename "$f") duration_s=$d"
          done
      - name: Thumbnail draft from title
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys
          s = json.loads(pathlib.Path('outputs/draft/script.json').read_text())
          words = [w for w in s['title'].replace(':', ' ').split() if w.isalpha()][:3]
          subprocess.run([sys.executable, '-m', 'channel.cli', 'thumbnail', '--text', ' '.join(words).upper(),
                          '--title', s['title'], '--out', 'outputs/preview/thumbnail.jpg'], check=True)
          PY
      - name: Review pack (contact sheets, audio levels, speech round-trip)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.qa_pack --video outputs/preview/preview.mp4 --script outputs/draft/script.json \
            --shorts outputs/preview/shorts --out outputs/qa > outputs/qa_summary.json
          python - <<'PY'
          import json
          r=json.load(open('outputs/qa/qa_report.json'))
          v=r['video']; keep={k:v.get(k) for k in ('duration_s','integrated_lufs','true_peak_dbfs','silences_over_1_5s','longest_silence_s','black_segments','asr')}
          keep['shorts']=[{k:s.get(k) for k in ('file','duration_s','integrated_lufs','silences_over_1_5s','black_segments')} for s in r['shorts']]
          print('::notice title=qa::'+json.dumps(keep,ensure_ascii=False)[:3800])
          PY
      - name: Encrypted review pack (videos, thumbnail, frames, QA) to qa/${{ github.run_id }}
        if: success() && inputs.delivery_pubkey != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBKEY_B64: ${{ inputs.delivery_pubkey }}
        run: |
          set -euo pipefail
          umask 077
          pack=$RUNNER_TEMP/pack; mkdir -p "$pack"
          cp outputs/qa/*.jpg outputs/qa/qa_report.json "$pack/"
          cp outputs/qa/asr_transcript.txt "$pack/" 2>/dev/null || true
          cp outputs/draft/script.json outputs/draft/storyboard.json "$pack/"
          cp outputs/draft/metadata_draft.json "$pack/" 2>/dev/null || true
          cp outputs/preview/photos/credits.txt "$pack/" 2>/dev/null || true
          cp outputs/preview/preview_work/render_report.json "$pack/" 2>/dev/null || true
          cp outputs/preview/preview.mp4 "$pack/long_video.mp4"
          cp outputs/preview/preview.srt "$pack/long_video.srt" 2>/dev/null || true
          for f in outputs/preview/shorts/short_*.mp4; do cp "$f" "$pack/"; done
          cp outputs/preview/thumbnail.jpg "$pack/" 2>/dev/null || true
          tar -C "$pack" -cf "$RUNNER_TEMP/pack.tar" .
          rm -rf "$pack"
          echo "$PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/pub.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -noout -text | head -1
          out=$RUNNER_TEMP/enc; mkdir -p "$out"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/k" -out "$out/key.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "file:$RUNNER_TEMP/k" \
            -in "$RUNNER_TEMP/pack.tar" -out "$RUNNER_TEMP/pack.enc"
          shred -u "$RUNNER_TEMP/k" "$RUNNER_TEMP/pack.tar"
          split -b 90m -d -a 2 "$RUNNER_TEMP/pack.enc" "$out/pack.enc.part"
          rm -f "$RUNNER_TEMP/pack.enc"
          sha256sum "$out"/* | sed "s#$out/##" > "$out/SHA256SUMS"
          ls -la "$out"
          cd "$out"
          git init -q -b "qa/${{ github.run_id }}"
          git config user.name 'youtube-ai-engine'
          git config user.email 'youtube-ai-engine@users.noreply.github.com'
          git add -A && git commit -q -m "Encrypted review pack for preview run ${{ github.run_id }} (unreadable without the owner-session key)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "qa/${{ github.run_id }}"
          echo "::notice title=qa-branch::qa/${{ github.run_id }} (encrypted only)"
      - name: Publish safe render summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('outputs/preview/preview_work/render_report.json')
          if not p.exists():
              print('::warning title=render-report::render_report.json missing'); raise SystemExit
          r = json.loads(p.read_text())
          keep = {k: r.get(k) for k in ('narration_backend', 'alignment', 'captions', 'editorial_review',
                                        'placeholder_scenes', 'ready_for_publication')}
          keep['technical_qc_passed'] = (r.get('technical_qc') or {}).get('passed')
          keep['technical_qc_failures'] = (r.get('technical_qc') or {}).get('failures')
          keep['chapters'] = len(r.get('chapters') or [])
          keep['audio'] = {k: (r.get('audio') or {}).get(k) for k in ('integrated_lufs', 'true_peak_dbtp')}
          print('::notice title=render-report::' + json.dumps(keep, separators=(',', ':')).replace('%', '%25')[:3800])
          PY
          if [ -f outputs/preview/preview.mp4 ]; then
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 outputs/preview/preview.mp4)
            h=$(sha256sum outputs/preview/preview.mp4 | cut -d' ' -f1)
            echo "::notice title=mp4::duration_s=$d sha256=$h"
          fi
      - name: Save non-video reports (no MP4, thumbnail or frames in public artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-reports-${{ github.run_id }}
          path: |
            outputs/qa/qa_report.json
            outputs/preview/preview_work/render_report.json
            outputs/preview/shorts/shorts_report.json
            outputs/preview/photos/credits.json
          retention-days: 14
          if-no-files-found: warn
