name: Free provider and router integration (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect provider authentication and attempt only verified zero-priced routing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_UPLOAD_ALLOWED: '0'
          YOUTUBE_PUBLIC_ALLOWED: '0'
        run: python -m scripts.check_free_providers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-provider-report-${{ github.run_id }}
          path: outputs/free-provider-check
          retention-days: 3
