name: Wildlife footage audit (Commons, licence-checked, no download of video)
on:
  workflow_dispatch:
    inputs:
      species:
        description: Semicolon-separated search terms (scientific names work best)
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-production.txt
      - name: Audit
        env:
          SPECIES: ${{ inputs.species }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from channel.footage import audit
          rows = audit([s.strip() for s in os.environ['SPECIES'].split(';') if s.strip()], pathlib.Path('outputs/footage/audit.json'))
          for r in rows:
              short = {k: v for k, v in r.items() if k != 'clips'}
              short['titles'] = [f"{c['title'][5:60]} | {c['duration_s']}s | {c['height']}p | {c['license']}" for c in r.get('clips', [])[:8]]
              print('::notice title=' + r['species'].replace(':', ' ') + '::' + json.dumps(short, ensure_ascii=False)[:3800])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: footage-audit-${{ github.run_id }}
          path: outputs/footage/audit.json
          retention-days: 7
