name: YouTube OAuth check (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-oauth-check
  cancel-in-progress: false
jobs:
  check:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OAuth SDK only
        run: python -m pip install -r requirements-release.txt
      - name: Test OAuth protections offline
        run: python -m unittest discover -s tests -p test_cloud_oauth.py -v
      - name: Refresh real owner token without uploading
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_UPLOAD_ALLOWED: '0'
          YOUTUBE_PUBLIC_ALLOWED: '0'
        run: python -m scripts.check_cloud_oauth
