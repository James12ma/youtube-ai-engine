name: Anim Engine - rendu d'un job

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Fichier de job (ex. anim-engine/jobs/poc-001.json)"
        required: true
        default: "anim-engine/jobs/poc-001.json"
  push:
    paths: ["anim-engine/jobs/**.json"]

permissions:
  contents: write

concurrency:
  group: anim-engine
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: anim-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: anim-engine/requirements.txt
      - name: Installer Blender (module bpy) + FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxi6 libxkbcommon0 libsm6
          pip install -r requirements.txt
      - name: Test de fumée
        run: python tests/smoke_blender.py
      - name: Rendu + QA
        run: |
          JOB="${{ github.event.inputs.job }}"
          [ -z "$JOB" ] && JOB=$(git diff --name-only HEAD~1 HEAD -- jobs/ | head -1 | sed 's#^anim-engine/##')
          JOB="${JOB#anim-engine/}"
          echo "JOB=$JOB" >> "$GITHUB_ENV"
          python -m engine.run "$JOB"
      - name: Publier MP4 + rapport QA
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(python3 -c "import json;print(json.load(open('$JOB'))['id'])")
          gh release view anim-engine >/dev/null 2>&1 || gh release create anim-engine --title "Anim Engine - rendus" --notes "Rendus automatiques."
          for f in output/$ID/$ID.mp4 qa/$ID.md; do [ -f "$f" ] && gh release upload anim-engine "$f" --clobber; done
          git config user.name "anim-engine-bot"; git config user.email "anim-engine-bot@users.noreply.github.com"
          git add -f jobs qa output/$ID/state.json || true
          git diff --cached --quiet || git commit -m "Job $ID : $(python3 -c "import json;print(json.load(open('$JOB'))['status'])")"
          git pull --rebase origin main && git push origin HEAD:main
