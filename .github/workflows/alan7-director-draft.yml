name: Alan7 Director verified draft (explicit owner request, free only)
run-name: alan7 ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Short opaque Alan7 job ID
        required: true
      payload:
        description: Explicit owner-approved topic, language, mode and 2 sources JSON
        required: true
permissions:
  contents: write
concurrency:
  group: alan7-director-draft-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DIRECTOR_JOB_ID: ${{ inputs.job_id }}
      DIRECTOR_JOB_PAYLOAD: ${{ inputs.payload }}
      ZERO_COST_ACTIONS_CONFIRMED: ${{ vars.ZERO_COST_ACTIONS_CONFIRMED }}
      FREE_PROVIDER_ACCOUNTS_CONFIRMED: ${{ vars.FREE_PROVIDER_ACCOUNTS_CONFIRMED }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: 'google/gemma-4-26b-a4b-it:free'
      ROUTER_ALLOW_LIVE_API: '1'
      ENABLE_LIVE_LLM: '1'
    steps:
      - name: Fail closed if free-tier resources not confirmed
        run: |
          set -euo pipefail
          test "$ZERO_COST_ACTIONS_CONFIRMED" = '1' || { echo '::error::Actions free-plan not confirmed'; exit 1; }
          test "$FREE_PROVIDER_ACCOUNTS_CONFIRMED" = '1' || { echo '::error::Free-only LLM provider accounts not confirmed'; exit 1; }
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::No free provider key configured; no script created'; exit 1;
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate owner-provided public sources before installing anything
        run: |
          python - <<'PY'
          import os
          from scripts.director_job import validate_job
          d=validate_job(os.environ['DIRECTOR_JOB_PAYLOAD'],os.environ['DIRECTOR_JOB_ID'])
          print('Owner-approved HTTPS sources:',len(d['urls']),'mode:',d['mode'])
          PY
      - name: Install existing verified pipeline (no paid packages)
        run: python -m pip install -r requirements.txt -r requirements-production.txt
      - name: Git identity for existing versioned draft state
        run: |
          git config user.name 'youtube-ai-engine'
          git config user.email 'youtube-ai-engine@users.noreply.github.com'
      - name: Existing research -> verification -> script -> storyboard -> Director review
        run: python -m scripts.director_job
      - name: Store Director draft or labeled failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan7-director-${{ inputs.job_id }}
          path: outputs/director-jobs/${{ inputs.job_id }}
          if-no-files-found: error
          retention-days: 7
      - name: Send evidence-labeled owner review if there is a real candidate
        if: always()
        env:
          TG: ${{ secrets.ALAN7_TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.ALAN7_OWNER_ID }}
        run: |
          set +x
          folder="outputs/director-jobs/$DIRECTOR_JOB_ID"
          file="$folder/director/script_full_review.txt"
          caption="AI Director $DIRECTOR_JOB_ID — VERIFIED DRAFT (owner review required; not published)"
          if [ ! -f "$file" ] && [ -f "$folder/unverified_candidate_review.txt" ]; then
            file="$folder/unverified_candidate_review.txt"
            caption="AI Director $DIRECTOR_JOB_ID — FAILED QA, UNVERIFIED candidate; NOT APPROVED"
          fi
          if [ ! -f "$file" ]; then
            echo '::notice::No script candidate saved, so no document will be sent'
            exit 0
          fi
          if [ -z "$TG" ] || [ -z "$OWNER" ]; then
            echo '::warning::Bot secrets unavailable; retrieve the private GitHub Actions artifact instead'
          else
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -F "chat_id=$OWNER" -F "caption=$caption" \
              -F "document=@${file};type=text/plain" "https://api.telegram.org/bot$TG/sendDocument" || true)
            if [ "$code" != 200 ]; then echo '::warning::Telegram sendDocument failed; GitHub artifact remains'; fi
          fi
