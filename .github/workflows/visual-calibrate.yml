name: Visual QA calibration (hand-labelled NOAA public-domain footage; numbers only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          echo "HF_HOME=$RUNNER_TEMP/hf" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0' 'torchvision==0.23.0'
          python -m pip install -r requirements.txt 'transformers>=4.44,<5' 'Pillow>=10' httpx
      - run: python -m scripts.visual_calibrate outputs/calibrate
