name: LogicScript preservation proof (public no-cost runner)
on:
  pull_request:
    branches: [main]
    paths:
      - 'production_pro/**'
      - 'scripts/preservation_smoke.py'
      - 'tests/test_lesson_rendering.py'
      - '.github/workflows/logicscript-preservation.yml'
permissions:
  contents: read
jobs:
  proof:
    # No private/paid runner, secrets, environment, cache, or artifact storage.
    if: github.event.repository.private == false && github.head_ref == 'work/logicscript-preservation-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local recording dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core libreoffice-calc python3-uno xvfb xdotool espeak
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-production.txt -r requirements-production-pro.txt -r requirements-release.txt
          python -m playwright install --with-deps chromium
          # Append ONLY after pip's packages. Prepending the distro directory
          # shadows current typing_extensions and prevents Pydantic collection.
          python - <<'PY'
          import pathlib, site
          pathlib.Path(site.getsitepackages()[0], 'local_uno.pth').write_text('/usr/lib/python3/dist-packages\n/usr/lib/libreoffice/program\n')
          PY
      - name: Existing tests, including genuine browser and Calc tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -rs --junitxml=outputs/preservation-junit.xml
      - name: Actual narrated spreadsheet screen capture (engineering voice)
        env:
          PYTHONPATH: .
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -m scripts.preservation_smoke --mode screen --engineering-voice --output-dir outputs/preservation-screen
      - name: Export review evidence without artifact storage
        if: always()
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib
          # Explicit public dummy-data review deliverables only; never secrets/model caches.
          names=['outputs/preservation-screen/LogicScript_Screen_Proof.mp4',
                 'outputs/preservation-screen/report.json','outputs/preservation-junit.xml',
                 'outputs/preservation-screen/actions.json']
          names += [str(p) for p in sorted(pathlib.Path('outputs/preservation-screen/capture').glob('*.png'))]
          for name in names:
              p=pathlib.Path(name)
              if not p.is_file():
                  print('EVIDENCE_MISSING '+name); continue
              data=p.read_bytes()
              if len(data)>12_000_000:raise RuntimeError('Review evidence exceeds bounded log export')
              print('EVIDENCE_BEGIN '+p.name+' '+hashlib.sha256(data).hexdigest())
              encoded=base64.b64encode(data).decode()
              for i in range(0,len(encoded),3000):print('EVIDENCE_DATA '+encoded[i:i+3000])
              print('EVIDENCE_END '+p.name)
          PY
