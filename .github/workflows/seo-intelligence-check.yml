name: SEO Intelligence isolated offline tests
on:
  pull_request:
    paths:
      - 'channel/seo_intelligence.py'
      - 'channel/seo_package.py'
      - 'channel/director.py'
      - 'channel/research.py'
      - 'scripts/director_job.py'
      - '.github/workflows/alan7-director-draft.yml'
      - 'channel/cli.py'
      - 'tests/test_seo_intelligence.py'
      - 'tests/test_seo_package.py'
      - 'tests/test_director_review.py'
      - 'tests/test_director_job.py'
      - 'alan7_bot/test/seo_pack.test.mjs'
      - 'alan7_bot/test/director.test.mjs'
      - 'alan7_bot/test/director_draft.test.mjs'
      - 'alan7_bot/src/index.js'
      - 'alan7_bot/test/seo.test.mjs'
      - '.github/workflows/seo-intelligence-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo-offline:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal free test dependencies
        run: python -m pip install -r requirements.txt -r requirements-production.txt pytest
      - name: Validate Director stdlib preflight without third-party site packages
        run: |
          python -S - <<'PY'
          import json
          from scripts.director_job import validate_job
          data=json.dumps({"language":"en","mode":"tutorial","topic":"Excel expense tracker",
                           "urls":["https://example.org/a","https://example.com/b"]})
          assert validate_job(data,"f5d48791")["mode"]=="tutorial"
          PY
      - name: Compile new Python SEO integration
        run: python -m compileall -q channel/seo_intelligence.py channel/seo_package.py channel/director.py channel/research.py scripts/director_job.py channel/cli.py tests/test_seo_intelligence.py tests/test_seo_package.py tests/test_director_review.py tests/test_director_job.py
      - name: Python SEO safety and mock-API tests
        run: python -m pytest -q tests/test_seo_intelligence.py tests/test_seo_package.py tests/test_director_review.py tests/test_director_job.py
      - name: CLI SEO command help smoke test
        run: python -m channel.cli seo-review --help
      - name: Node syntax and fake YouTube API tests
        run: |
          node --check alan7_bot/src/index.js
          node --test alan7_bot/test/seo.test.mjs alan7_bot/test/seo_pack.test.mjs alan7_bot/test/director.test.mjs alan7_bot/test/director_draft.test.mjs
