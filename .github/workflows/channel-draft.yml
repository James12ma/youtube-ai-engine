name: Curated YouTube script draft (owner initiated only)
on:
  workflow_dispatch:
  # Opt-in only. Work must set repository variable ENABLE_AUTOMATION=1 after owner approval.
  schedule:
    - cron: '23 0,8,16 * * *'
permissions:
  contents: write
concurrency:
  group: yt-channel-editorial-queue
  cancel-in-progress: false
jobs:
  draft:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1' && vars.FREE_PROVIDER_ACCOUNTS_CONFIRMED == '1' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTOMATION == '1')
    # This workflow may use external free quotas. Never upload videos.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ROUTER_ALLOW_LIVE_API: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Configure Git identity for durable draft state
        run: |
          git config user.name 'youtube-ai-engine'
          git config user.email 'youtube-ai-engine@users.noreply.github.com'
      - name: Produce ONLY research drafts from owner-approved sources
        run: |
          set -euo pipefail
          python -m channel.cli next-draft --repo . --queue topic_queue.json --out-root outputs/drafts --allow-free-live-api
      - name: Upload reviewed draft files for owner inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-editorial-draft-${{ github.run_id }}
          path: outputs/drafts
          if-no-files-found: ignore
          retention-days: 7
