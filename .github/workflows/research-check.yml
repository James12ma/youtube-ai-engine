name: Source-backed research and script dry run (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-verification
  cancel-in-progress: false
jobs:
  research:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-production.txt
      - name: Verify public sources and use only a verified zero-priced model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_UPLOAD_ALLOWED: '0'
          YOUTUBE_PUBLIC_ALLOWED: '0'
        run: python -m scripts.check_research_pipeline
      - name: Publish safe report summary as annotation
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('outputs/research-check/report.json')
          if p.exists():
              r = json.loads(p.read_text())
              print('::notice title=research-report::' + json.dumps(r, separators=(',', ':')).replace('%', '%25').replace('\n', ' ')[:3800])
          else:
              print('::warning title=research-report::report.json missing')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-script-dry-run-${{ github.run_id }}
          path: outputs/research-check
          retention-days: 3
