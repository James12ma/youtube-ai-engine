name: LogicScript Telegram (private review only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify credentials, send review video, or listen for five minutes
        type: choice
        options: [verify, deliver, listen]
        default: verify
permissions:
  contents: read
  actions: read
concurrency:
  group: logicscript-telegram
  cancel-in-progress: false
jobs:
  telegram:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transport only
        run: python -m pip install -r requirements.txt
      - name: Check required configuration without exposing values
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ('TELEGRAM_BOT_TOKEN', 'TELEGRAM_OWNER_ID') if not os.environ.get(name)]
          if missing:
              raise SystemExit('Secure configuration required: ' + ', '.join(missing))
          PY
      - name: Fetch the pinned reviewed video artifact
        if: inputs.mode != 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download 38721241174 --name lesson-polished --dir outputs/telegram-review
      - name: Owner-only Telegram operation (no YouTube credentials)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          BOT_MODE: ${{ inputs.mode }}
        run: python -m channel.telegram "$BOT_MODE"
