name: LogicScript short action test (private, no YouTube upload)

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'chatterbox = owner-approved shared voice (same as Alan7), piper = old voice'
        type: choice
        options: [chatterbox, piper]
        default: chatterbox
      delivery_pubkey:
        description: Base64 RSA public key (PEM); the video leaves the runner only encrypted
        required: true

permissions:
  contents: write  # only to push an ENCRYPTED review pack to qa/<run id>

concurrency:
  group: educational-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      VOICE_NAME: en_US-libritts-high
      CUDA_VISIBLE_DEVICES: ''
      YOUTUBE_UPLOAD_ALLOWED: '0'
      YOUTUBE_PUBLIC_ALLOWED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure runner-local model directories
        shell: bash
        run: |
          printf '%s\n' \
            "VOICE_DIR=$RUNNER_TEMP/piper-voices" \
            "HF_HOME=$RUNNER_TEMP/hf-cache" \
            "TORCH_HOME=$RUNNER_TEMP/torch-cache" \
            "NLTK_DATA=$RUNNER_TEMP/nltk-data" >> "$GITHUB_ENV"
      - name: Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libgomp1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.8.0' 'torchaudio==2.8.0' 'torchvision==0.23.0'
          # Install WhisperX's ENTIRE dependency graph; no --no-deps workaround.
          python -m pip install -r requirements-narration.txt -r requirements.txt -r requirements-production.txt -r requirements-production-pro.txt
          python -m pip check
          # WhisperX sentence segmentation requires this non-wheel resource.
          python - <<'PY'
          import nltk, os
          nltk.download('punkt_tab', download_dir=os.environ['NLTK_DATA'], raise_on_error=True)
          PY
          python - <<'PY'
          import torch, whisperx, piper
          from narration_pro import PiperNarrator, WhisperXAligner
          print('torch:', torch.__version__, 'CUDA wheel:', torch.version.cuda)
          assert torch.version.cuda is None, 'Expected CPU-only torch'
          PY
          ffmpeg -hide_banner -filters | grep -Eq ' subtitles '
      - name: Install Chromium for real responsive recordings
        run: python -m playwright install --with-deps chromium
      - name: Download Piper voice if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VOICE_DIR"
          if [[ ! -s "$VOICE_DIR/${VOICE_NAME}.onnx" || ! -s "$VOICE_DIR/${VOICE_NAME}.onnx.json" ]]; then
            python -m piper.download_voices --data-dir "$VOICE_DIR" "$VOICE_NAME"
          fi
          test -s "$VOICE_DIR/${VOICE_NAME}.onnx"
          test -s "$VOICE_DIR/${VOICE_NAME}.onnx.json"
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          dest=Path('outputs/educational');dest.mkdir(parents=True,exist_ok=True)
          urllib.request.urlretrieve('https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/libritts/high/MODEL_CARD', dest/'PIPER_MODEL_CARD.md')
          PY
          echo 'Voice model and config present; license and dataset terms must be reviewed separately.'
      - name: Texts to narrate
        if: inputs.voice == 'chatterbox'
        shell: bash
        run: python -m scripts.render_educational --sample --dump-texts narration_texts.json
      - name: Narrate (owner-approved shared voice, English)
        if: inputs.voice == 'chatterbox'
        uses: ./.github/actions/alan7-voice
        with:
          texts: narration_texts.json
          language: en
          out: outputs/narration
      - name: Render actual action-paced videos with neural voice and animated captions
        shell: bash
        run: |
          set -euo pipefail
          extra=(); [ "${{ inputs.voice }}" = chatterbox ] && extra=(--narration-dir outputs/narration)
          python -m scripts.render_educational --sample --voice "$VOICE_DIR/${VOICE_NAME}.onnx" \
            --output-dir outputs/educational "${extra[@]}"
      - name: Deliver the test video to the owner on Telegram
        env:
          TG: ${{ secrets.ALAN7_TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.ALAN7_OWNER_ID }}
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error -i outputs/educational/final.mp4 \
            -vf scale=1280:720 -c:v libx264 -crf 23 -preset veryfast -c:a aac -b:a 128k \
            -movflags +faststart outputs/educational/test_720p.mp4
          python - <<'PYTHON'
          import json, os, httpx
          from pathlib import Path
          p=Path('outputs/educational/test_720p.mp4')
          assert 1000 < p.stat().st_size < 49_000_000, 'Telegram video size limit'
          with p.open('rb') as f:
              r=httpx.post('https://api.telegram.org/bot'+os.environ['TG']+'/sendVideo',
                  data={'chat_id':os.environ['OWNER'],'supports_streaming':'true',
                        'caption':'LogicScript — tès reyèl motè a: sourit, klik, vwa Chatterbox ak soutit. Egzanp lokal; pa pibliye sou YouTube.'},
                  files={'video':('LogicScript_Action_Test.mp4',f,'video/mp4')}, timeout=180)
          ok = r.status_code == 200 and r.json().get('ok') is True
          print('::notice title=telegram::'+json.dumps({'http_status':r.status_code,'accepted':ok}))
          if not ok: raise SystemExit('Telegram video delivery failed')
          PYTHON
      - name: Encrypted review pack (public repo -> never plain artifacts)
        if: always()
        uses: ./.github/actions/encrypted-pack
        with:
          dir: outputs/educational
          pubkey_b64: ${{ inputs.delivery_pubkey }}
          token: ${{ github.token }}
          label: LogicScript lesson
