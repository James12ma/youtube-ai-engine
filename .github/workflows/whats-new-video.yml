name: LogicScript — What's new in <AI> (official pages, grounded, sent to Telegram; no upload)
on:
  workflow_dispatch:
    inputs:
      ai:
        type: choice
        options: [claude, chatgpt, gemini, copilot, grok, perplexity, meta-ai, deepseek]
        default: claude
      since:
        description: 'Period the video covers, e.g. "August 2026"'
        default: 'August 2026'
      fresh_plan:
        description: '1 = write a new script; 0 = reuse the last verified script for this AI (and its cached narration)'
        default: '0'
      plan_only:
        description: '1 = only write and check the script (shown in the run notes); the next run with fresh_plan=0 reuses it'
        default: '0'
      delivery_pubkey:
        description: Optional base64 RSA public key for the full-quality encrypted pack
        default: ''
permissions:
  contents: write  # only for the optional ENCRYPTED pack
concurrency:
  group: whats-new-${{ inputs.ai }}
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      CUDA_VISIBLE_DEVICES: ''
      YOUTUBE_UPLOAD_ALLOWED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          set -uo pipefail
          printf '%s\n' "HF_HOME=$RUNNER_TEMP/hf" "NLTK_DATA=$RUNNER_TEMP/nltk" >> "$GITHUB_ENV"
          step() { if ! "$@" > dep.log 2>&1; then echo "::error title=deps ($1 $2)::$(grep -v -E '^\s*$|Downloading|Collecting|━' dep.log | tail -n 25 | tr '\n' ' ' | tail -c 3000)"; exit 1; fi; }
          step sudo apt-get update
          step sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 fonts-dejavu-core
          step python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
          step python -m pip install -r requirements-narration.txt -r requirements.txt -r requirements-production.txt -r requirements-production-pro.txt
          python -c "import playwright" 2>/dev/null || step python -m pip install playwright
          step python -m playwright install --with-deps chromium
          step python -c "import nltk,sys; nltk.download('punkt_tab', download_dir=sys.argv[1])" "$RUNNER_TEMP/nltk"
      - name: Last verified plan for this AI
        id: plancache
        if: inputs.fresh_plan != '1'
        uses: actions/cache/restore@v4
        with:
          path: outputs/wn
          key: whats-new-plan-${{ inputs.ai }}-${{ github.run_id }}
          restore-keys: whats-new-plan-${{ inputs.ai }}-
      - name: Grounded plan from the official pages (free model)
        if: steps.plancache.outputs.cache-matched-key == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_LIVE_LLM: '1'        # free-tier models only (same switch as channel-draft.yml)
          AI: ${{ inputs.ai }}
          SINCE: ${{ inputs.since }}
        run: |
          set +e -u   # GitHub runs bash with -e: keep going to report the error
          python -m scripts.whats_new_plan --ai "$AI" --since "$SINCE" --out outputs/wn > plan_summary.json 2> plan_err.txt; rc=$?
          python -m scripts.gh_note notice plan plan_summary.json
          [ -f outputs/wn/grounding_report.json ] && python -m scripts.gh_note notice grounding outputs/wn/grounding_report.json 3800
          grep -h "plan part written by" plan_err.txt > plan_models.txt; python -m scripts.gh_note notice plan-models plan_models.txt
          [ $rc -eq 0 ] || { python -m scripts.gh_note error plan-error plan_err.txt 3000; exit 1; }
      - name: Keep the verified plan (reruns reuse it and its narration)
        uses: actions/cache/save@v4
        with:
          path: outputs/wn
          key: whats-new-plan-${{ inputs.ai }}-${{ github.run_id }}
      - name: Show the verified script
        if: always() && inputs.plan_only == '1'
        run: |
          python - <<'PY'
          import json, os
          p = json.load(open('outputs/wn/plan.json')) if os.path.exists('outputs/wn/plan.json') else {'segments': []}
          text = '\n'.join(f"[{i}] {s['title']} ({s['url']}): {s['narration']}" for i, s in enumerate(p['segments']))
          g = json.load(open('outputs/wn/grounding_report.json'))
          cuts = '\n'.join(f"CUT [{s['title']}] {c['sentence']} {c['facts_not_near_quote']} e={c['entail']}" for s in p['segments'] for c in s.get('cut_sentences', []))
          drops = '\n'.join(f"DROP [{d['title']}] {d['reason']} :: " + ' / '.join(f"{c['sentence']} e={c['entail']}" for c in d.get('cut_sentences', [])[:2]) for d in g['segments_dropped'])
          esc = lambda t: t.replace('%', '%25').replace('\r', ' ').replace('\n', '%0A')
          for name, body in (('script', text), ('cut', cuts), ('dropped', drops)):
              for k in range(0, min(len(body), 3 * 3800), 3800):
                  print(f'::notice title={name}-{k // 3800}::{esc(body[k:k + 3800])}')
          PY
      - name: Narrate (owner-approved shared voice, English)
        if: inputs.plan_only != '1'
        uses: ./.github/actions/alan7-voice
        with:
          texts: outputs/wn/narration_texts.json
          language: en
          out: outputs/narration
      - name: Record the official pages and edit
        if: inputs.plan_only != '1'
        run: |
          set +e
          python -m scripts.render_web_explainer --plan outputs/wn/plan.json --narration-dir outputs/narration --out outputs/wn/video.mp4 > render_out.txt 2> render_err.txt; rc=$?
          python -m scripts.gh_note notice render render_out.txt
          [ $rc -eq 0 ] || { python -m scripts.gh_note error render-error render_err.txt 3500; exit 1; }
      - name: QA and YouTube package
        if: inputs.plan_only != '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          p = json.load(open('outputs/wn/plan.json')); r = json.load(open('outputs/wn/video_work/render_report.json'))
          from channel.ai_sources import AI_SOURCES
          src = AI_SOURCES[p['ai']]
          dur = float(subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','outputs/wn/video.mp4'],capture_output=True,text=True).stdout)
          desc = [p['title'], '', f"Everything new in {src['name']}, explained from {src['company']}'s official announcements and release notes.", '', 'Chapters'] + r['chapters'] + \
                 ['', 'Official sources'] + [f'- {u}' for u in r['sources']] + ['', f"All pages shown are the official {src['company']} pages. LogicScript is not affiliated with {src['company']}. Narration: synthetic AI voice.", '', f"#{src['name'].replace(' ','')} #AI #LogicScript"]
          pkg = f"TITLE\n{p['title']}\n\nDESCRIPTION\n" + '\n'.join(desc) + "\n\nSETTINGS\n- Altered or synthetic content: YES (synthetic voice)\n- Made for kids: NO\n- Captions are burned into the video: do not upload another subtitle file\n"
          open('outputs/wn/YouTube_package.txt','w').write(pkg)
          print('::notice title=video::' + json.dumps({'duration_s': round(dur,1), 'quotes_highlighted': r['quotes_highlighted'], 'segments': len(r['segments']), 'padded_total_s': r['padded_total_s'], 'errors': [s['error'] for s in r['segments'] if s['error']]}))
          PY
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 outputs/wn/video.mp4)
          vb=$(python -c "print(int(46*8*1024/$d - 96))")
          ffmpeg -y -hide_banner -loglevel error -i outputs/wn/video.mp4 -vf scale=1280:720 -c:v libx264 -preset slow -b:v ${vb}k -maxrate ${vb}k -bufsize $((vb*2))k -c:a aac -b:a 96k -movflags +faststart outputs/wn/telegram.mp4
          ls -la outputs/wn
      - name: Send to the owner on Telegram
        if: inputs.plan_only != '1'
        env:
          TG: ${{ secrets.ALAN7_TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.ALAN7_OWNER_ID }}
        run: |
          set -uo pipefail
          title=$(head -2 outputs/wn/YouTube_package.txt | tail -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -F chat_id="$OWNER" -F supports_streaming=true -F caption="LogicScript — $title (preview 720p, pa pibliye)" -F video=@outputs/wn/telegram.mp4 "https://api.telegram.org/bot$TG/sendVideo")
          echo "::notice title=telegram video::HTTP $code"
          curl -s -o /dev/null -F chat_id="$OWNER" -F caption="Tit, deskripsyon, chapit ak sous pou YouTube" -F document=@outputs/wn/YouTube_package.txt "https://api.telegram.org/bot$TG/sendDocument"
      - name: Full-quality encrypted pack
        if: inputs.delivery_pubkey != '' && inputs.plan_only != '1'
        uses: ./.github/actions/encrypted-pack
        with:
          dir: outputs/wn
          pubkey_b64: ${{ inputs.delivery_pubkey }}
          token: ${{ github.token }}
          label: whats-new video
