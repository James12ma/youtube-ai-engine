name: Spanish voice pronunciation test (free Piper voices, encrypted samples)
on:
  workflow_dispatch:
    inputs:
      voices:
        description: Comma-separated Piper voices
        default: es_MX-claude-high,es_MX-ald-medium,es_ES-davefx-medium,es_ES-sharvard-medium,es_AR-daniela-high
      delivery_pubkey:
        description: Base64 RSA public key (PEM)
        required: true
permissions:
  contents: write  # only to push the ENCRYPTED samples to qa/<run id>
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and voices
        env:
          VOICES: ${{ inputs.voices }}
        run: |
          set -euo pipefail
          echo "VOICE_DIR=$RUNNER_TEMP/voices" >> "$GITHUB_ENV"; echo "HF_HOME=$RUNNER_TEMP/hf" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0' 'torchaudio==2.8.0' 'torchvision==0.23.0'
          python -m pip install -r requirements-narration.txt
          mkdir -p "$RUNNER_TEMP/voices"
          for v in ${VOICES//,/ }; do
            [[ "$v" =~ ^[a-zA-Z_]+-[a-zA-Z0-9_]+-(x_low|low|medium|high)$ ]] || { echo "bad voice $v"; exit 1; }
            python -m piper.download_voices --data-dir "$RUNNER_TEMP/voices" "$v" || echo "::warning::could not download $v"
          done
      - name: Test
        env:
          VOICES: ${{ inputs.voices }}
        run: |
          python -m scripts.voice_test --voices-dir "$VOICE_DIR" --voices "$VOICES" --out outputs/voices > /dev/null
          python - <<'PY'
          import json
          for r in json.load(open('outputs/voices/results.json')):
              print('::notice title=' + r['voice'] + '::' + json.dumps(r, ensure_ascii=False)[:3800])
          PY
      - name: Encrypted samples to qa/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBKEY_B64: ${{ inputs.delivery_pubkey }}
        run: |
          set -euo pipefail
          umask 077
          tar -C outputs/voices -cf "$RUNNER_TEMP/pack.tar" .
          echo "$PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/pub.pem"
          out=$RUNNER_TEMP/enc; mkdir -p "$out"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/k" -out "$out/key.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "file:$RUNNER_TEMP/k" \
            -in "$RUNNER_TEMP/pack.tar" -out "$out/pack.enc.part00"
          shred -u "$RUNNER_TEMP/k" "$RUNNER_TEMP/pack.tar"
          (cd "$out" && sha256sum * > SHA256SUMS)
          cd "$out"; git init -q -b "qa/${{ github.run_id }}"
          git config user.name 'youtube-ai-engine'; git config user.email 'youtube-ai-engine@users.noreply.github.com'
          git add -A && git commit -q -m "Encrypted voice samples ${{ github.run_id }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "qa/${{ github.run_id }}"
          echo "::notice title=qa-branch::qa/${{ github.run_id }}"
