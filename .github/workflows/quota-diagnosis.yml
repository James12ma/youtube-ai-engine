name: Zero-cost AI quota diagnosis (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: vars.ZERO_COST_ACTIONS_CONFIRMED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.diagnose_free_quota
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-diagnosis
          path: outputs/quota-diagnosis/
          retention-days: 3
