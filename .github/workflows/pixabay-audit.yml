name: Pixabay footage audit (free API key from secret; encrypted review sheets)
on:
  workflow_dispatch:
    inputs:
      queries:
        description: Semicolon-separated searches
        default: humpback whale;humpback whale underwater;humpback calf;whale mother calf;whale underwater;humpback breach;whale breaching;whale tail
      min_width:
        description: Minimum width (1920 = Full HD)
        default: '1920'
      review_tags:
        description: Regex on tags selecting clips for review sheets (empty = first results)
        default: 'whale|humpback|megaptera|cetacean'
      delivery_pubkey:
        description: Base64 RSA public key (PEM)
        required: true
permissions:
  contents: write  # only to push ENCRYPTED review sheets to qa/<run id>
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt -r requirements-production.txt
      - name: Search (key never printed; GitHub also masks secrets)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          QUERIES: ${{ inputs.queries }}
          MIN_WIDTH: ${{ inputs.min_width }}
          REVIEW_TAGS: ${{ inputs.review_tags }}
        run: |
          set -uo pipefail
          if [ -z "${PIXABAY_API_KEY}" ]; then echo "::error title=secret::PIXABAY_API_KEY is not set"; exit 1; fi
          python -m channel.pixabay --queries "$QUERIES" --min-width "$MIN_WIDTH" --review-tags "$REVIEW_TAGS" --review-limit 60 --out outputs/pixabay > outputs_summary.json 2> err.txt; rc=$?
          echo "::notice title=summary::rc=$rc $(head -c 3000 outputs_summary.json)"
          [ $rc -eq 0 ] || echo "::warning title=stderr::$(tail -c 1500 err.txt | tr '\n' ' ' | sed "s/${PIXABAY_API_KEY}/***/g")"
          [ $rc -eq 0 ] || exit $rc
          python - <<'PY'
          import json
          r = json.load(open('outputs/pixabay/pixabay_audit.json'))
          import re
          rows = [f"{c['id']}|{c['best']['height']}p|{c['duration_s']}s|{c['author'][:20]}|{c['tags'][:70]}" for c in r['clips'] if re.search(r'whale|humpback|megaptera|cetacean', c['tags'], re.I)]
          print(f"::notice title=whale-tagged::{len(rows)} of {r['unique_clips']} unique clips")
          for i in range(0, len(rows), 15):
              print(f'::notice title=clips {i//15}::' + json.dumps(rows[i:i+15], ensure_ascii=False)[:3800])
          PY
      - name: Encrypted pack to qa/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBKEY_B64: ${{ inputs.delivery_pubkey }}
        run: |
          set -euo pipefail
          umask 077
          tar -C outputs/pixabay -cf "$RUNNER_TEMP/pack.tar" $(cd outputs/pixabay && ls *.jpg pixabay_audit.json)
          echo "$PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/pub.pem"
          out=$RUNNER_TEMP/enc; mkdir -p "$out"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/k" -out "$out/key.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "file:$RUNNER_TEMP/k" \
            -in "$RUNNER_TEMP/pack.tar" -out "$out/pack.enc.part00"
          shred -u "$RUNNER_TEMP/k" "$RUNNER_TEMP/pack.tar"
          (cd "$out" && sha256sum * > SHA256SUMS)
          cd "$out"; git init -q -b "qa/${{ github.run_id }}"
          git config user.name 'youtube-ai-engine'; git config user.email 'youtube-ai-engine@users.noreply.github.com'
          git add -A && git commit -q -m "Encrypted Pixabay review ${{ github.run_id }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "qa/${{ github.run_id }}"
          echo "::notice title=qa-branch::qa/${{ github.run_id }}"
