name: Histoires - rendu des videos

on:
  push:
    paths: ["histoires-engine/episodes/**", "histoires-engine/render.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: histoires-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: histoires-engine
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts pillow requests
      - name: Rendre les episodes prets
        run: |
          mkdir -p output
          export GH_TOKEN=${{ github.token }}
          for f in episodes/*.json; do
            id=$(python3 -c "import json;d=json.load(open('$f'));print(d['id'] if d.get('status')=='ready' else '')")
            [ -z "$id" ] && continue
            gh release view histoires-videos --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$id.mp4" && continue
            python3 render.py "$f" --out output 2>&1 | tee -a output/render.log || echo "ECHEC $f" | tee -a output/render.log
          done
      - name: Publier les MP4 en release publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view histoires-videos >/dev/null 2>&1 || gh release create histoires-videos --title "Histoires Vraies - videos" --notes "Videos rendues automatiquement."
          for v in output/*.mp4; do [ -f "$v" ] && gh release upload histoires-videos "$v" --clobber; done
      - name: Enregistrer credits et journal
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Rendu automatique $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
